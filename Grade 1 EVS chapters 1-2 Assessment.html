<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVS Grade 1 - Chapters 1-2 Assessment</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #10B981;
            --secondary: #F59E0B;
            --accent: #3B82F6;
            --dark: #1F2937;
            --light: #F3F4F6;
            --success: #10B981;
            --danger: #EF4444;
            --dark-bg: #0F1419;
            --card-bg: #1E293B;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0F1419 0%, #1A4D2E 50%, #0D3B2B 100%);
            min-height: 100vh;
            padding: 10px;
            animation: bgShift 20s ease infinite;
            color: #E5E7EB;
        }

        @keyframes bgShift {
            0%, 100% { background: linear-gradient(135deg, #0F1419 0%, #1A4D2E 50%, #0D3B2B 100%); }
            50% { background: linear-gradient(135deg, #1A4D2E 0%, #0D3B2B 50%, #0F1419 100%); }
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: var(--primary);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: slideDown 0.6s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .badge {
            display: inline-block;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 8px 16px;
            border-radius: 25px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 15px;
            animation: pulse 2s ease infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .header h1 {
            color: #E5E7EB;
            font-size: 32px;
            margin: 10px 0;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: #9CA3AF;
            font-size: 16px;
            margin: 5px 0;
        }

        .progress-section {
            margin: 25px 0;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-weight: 600;
            color: #E5E7EB;
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background: rgba(75, 85, 99, 0.3);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.8);
        }

        .question-container {
            margin-bottom: 35px;
            padding: 25px;
            background: rgba(30, 41, 59, 0.8);
            border-radius: 15px;
            border-left: 5px solid var(--primary);
            animation: slideIn 0.5s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(16, 185, 129, 0.15);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .question-number {
            font-weight: 700;
            color: white;
            font-size: 14px;
            background: var(--primary);
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 12px;
        }

        .question-text {
            font-size: 18px;
            color: #E5E7EB;
            margin-bottom: 20px;
            font-weight: 600;
            line-height: 1.5;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            border: 2px solid rgba(75, 85, 99, 0.4);
            border-radius: 10px;
            background: rgba(15, 20, 25, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .option::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s ease;
        }

        .option:hover {
            border-color: rgba(75, 85, 99, 0.6);
            background: rgba(75, 85, 99, 0.1);
            transform: translateX(3px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .option:hover::before {
            left: 100%;
        }

        .option input[type="radio"] {
            margin-right: 14px;
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--primary);
        }

        .option label {
            flex-grow: 1;
            cursor: pointer;
            font-size: 15px;
            color: #D1D5DB;
            font-weight: 500;
        }

        .feedback {
            margin-top: 15px;
            padding: 14px 16px;
            border-radius: 10px;
            font-weight: 600;
            display: none;
            animation: popIn 0.4s ease;
            border-left: 4px solid;
        }

        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.9);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .feedback.show {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .feedback.correct {
            background: rgba(16, 185, 129, 0.15);
            border-left-color: var(--success);
            color: #86EFAC;
        }

        .feedback.incorrect {
            background: rgba(239, 68, 68, 0.15);
            border-left-color: var(--danger);
            color: #FCA5A5;
        }

        .feedback-icon {
            font-size: 24px;
            font-weight: 700;
            animation: bounce 0.6s ease;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .option.answered {
            cursor: not-allowed;
        }

        .option.correct-answer {
            border-color: var(--success);
            background: rgba(16, 185, 129, 0.15);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }

        .option.wrong-answer {
            border-color: var(--danger);
            background: rgba(239, 68, 68, 0.15);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2);
        }

        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 40px;
            flex-wrap: wrap;
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        button {
            padding: 12px 30px;
            font-size: 15px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
        }

        button:active {
            transform: translateY(-1px);
        }

        .btn-next {
            background: var(--primary);
            color: white;
        }

        .btn-next:disabled {
            background: #4B5563;
            cursor: not-allowed;
            opacity: 0.6;
            transform: none;
        }

        .btn-submit {
            background: var(--secondary);
            color: white;
            min-width: 160px;
        }

        .btn-reset {
            background: #6B7280;
            color: white;
        }

        .results-container {
            display: none;
            text-align: center;
            padding: 40px;
            background: rgba(30, 41, 59, 0.8);
            border-radius: 15px;
            margin-top: 30px;
            animation: popIn 0.6s ease;
            border: 1px solid rgba(16, 185, 129, 0.15);
        }

        .results-container.show {
            display: block;
        }

        .results-header {
            margin-bottom: 30px;
            animation: slideDown 0.6s ease;
        }

        .results-header h2 {
            font-size: 28px;
            color: #E5E7EB;
            margin-bottom: 10px;
        }

        .score-circle {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: 700;
            color: white;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            animation: scaleIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .score-circle.excellent {
            background: #10B981;
        }

        .score-circle.good {
            background: #F59E0B;
        }

        .score-circle.fair {
            background: #3B82F6;
        }

        .score-circle.poor {
            background: #EF4444;
        }

        .performance {
            font-size: 20px;
            color: #E5E7EB;
            margin-bottom: 20px;
            font-weight: 600;
            animation: slideIn 0.6s ease 0.2s both;
        }

        .marks-info {
            font-size: 18px;
            color: #D1D5DB;
            margin: 20px 0;
            animation: slideIn 0.6s ease 0.3s both;
        }

        .marks-correct {
            color: #86EFAC;
            font-weight: 700;
        }

        .marks-incorrect {
            color: #FCA5A5;
            font-weight: 700;
        }

        .summary-table {
            width: 100%;
            margin-top: 25px;
            border-collapse: collapse;
            animation: slideIn 0.6s ease 0.4s both;
        }

        .summary-table th,
        .summary-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(75, 85, 99, 0.3);
            color: #D1D5DB;
        }

        .summary-table th {
            background: var(--primary);
            color: white;
            font-weight: 600;
        }

        .summary-table tr:hover {
            background: rgba(16, 185, 129, 0.1);
        }

        .summary-table tr:nth-child(even) {
            background: rgba(75, 85, 99, 0.1);
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            .header h1 {
                font-size: 24px;
            }

            .question-text {
                font-size: 16px;
            }

            .option {
                padding: 12px 14px;
            }

            .option label {
                font-size: 14px;
            }

            .score-circle {
                width: 130px;
                height: 130px;
                font-size: 36px;
            }

            .summary-table th,
            .summary-table td {
                padding: 8px;
                font-size: 13px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 12px;
                border-radius: 15px;
            }

            .header h1 {
                font-size: 20px;
            }

            .header p {
                font-size: 13px;
            }

            .question-text {
                font-size: 15px;
            }

            .option {
                padding: 10px 12px;
            }

            .option input[type="radio"] {
                width: 18px;
                height: 18px;
            }

            .option label {
                font-size: 13px;
            }

            button {
                padding: 10px 20px;
                font-size: 13px;
                flex: 1;
                min-width: 100px;
            }

            .btn-next,
            .btn-submit {
                width: 100%;
            }

            .score-circle {
                width: 110px;
                height: 110px;
                font-size: 28px;
            }

            .summary-table th,
            .summary-table td {
                padding: 6px;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="badge">🌍 EVS Grade 1 • Chapters 1-2</div>
            <h1>Environmental Studies Assessment</h1>
            <p>Me and My Body & Clothes We Wear</p>
        </div>

        <div class="progress-section">
            <div class="progress-info">
                <span id="progressText">Question 1 of 10</span>
                <span id="correctPercentage">0%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <div id="questionsContainer"></div>

        <div id="resultContainer" class="results-container">
            <div class="results-header">
                <h2>🎉 Assessment Complete!</h2>
            </div>
            <div class="score-circle" id="scoreCircle">0/10</div>
            <div class="performance" id="performanceText"></div>
            <div class="marks-info">
                <span class="marks-correct" id="correctCount">✓ 0 Correct</span> | 
                <span class="marks-incorrect" id="incorrectCount">✗ 0 Incorrect</span>
            </div>
            <table class="summary-table">
                <thead>
                    <tr>
                        <th>Question</th>
                        <th>Your Answer</th>
                        <th>Correct Answer</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="summaryBody"></tbody>
            </table>
            <div style="margin-top: 30px;">
                <button class="btn-reset" onclick="resetQuiz()">🔄 Try Again</button>
            </div>
        </div>

        <div class="controls" id="controls" style="display: none;">
            <button class="btn-next" id="nextBtn" onclick="nextQuestion()" disabled>➜ Next Question</button>
            <button class="btn-submit" onclick="submitQuiz()">✓ Submit</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                id: 1,
                question: "Which body part helps us to eat food?",
                options: ["Hands", "Mouth", "Legs", "Eyes"],
                correctAnswer: 1
            },
            {
                id: 2,
                question: "What do we use to write and hold things?",
                options: ["Legs", "Mouth", "Hands", "Ears"],
                correctAnswer: 2
            },
            {
                id: 3,
                question: "Which sense organ helps us to see?",
                options: ["Ears", "Eyes", "Nose", "Tongue"],
                correctAnswer: 1
            },
            {
                id: 4,
                question: "With which sense organ do we taste food?",
                options: ["Nose", "Ears", "Tongue", "Skin"],
                correctAnswer: 2
            },
            {
                id: 5,
                question: "Which body part helps us to run and jump?",
                options: ["Hands", "Mouth", "Legs", "Ears"],
                correctAnswer: 2
            },
            {
                id: 6,
                question: "Why do we wear clothes?",
                options: ["To look ugly", "To feel comfortable and protect our body", "For no reason", "Only to go to school"],
                correctAnswer: 1
            },
            {
                id: 7,
                question: "Which material is used to make clothes that keep us cool in summer?",
                options: ["Wool", "Cotton", "Silk", "Plastic"],
                correctAnswer: 1
            },
            {
                id: 8,
                question: "What do we wear in winter to keep ourselves warm?",
                options: ["T-shirt and shorts", "Woollen clothes like sweater and jacket", "Raincoat", "Sandals"],
                correctAnswer: 1
            },
            {
                id: 9,
                question: "Which of these is not a summer cloth?",
                options: ["T-shirt", "Shorts", "Frock", "Sweater"],
                correctAnswer: 3
            },
            {
                id: 10,
                question: "What do we wear on a rainy day to stay dry?",
                options: ["Summer clothes", "Winter clothes", "Raincoat and gumboots", "Just our uniform"],
                correctAnswer: 2
            }
        ];

        let currentQuestion = 0;
        let userAnswers = [];
        let answered = false;

        function renderQuestion() {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';

            const question = questions[currentQuestion];
            const questionDiv = document.createElement('div');
            questionDiv.className = 'question-container';

            let optionsHTML = '';
            question.options.forEach((option, index) => {
                optionsHTML += `
                    <div class="option" id="option-${index}">
                        <input type="radio" name="answer" id="answer-${index}" value="${index}" 
                            ${answered ? 'disabled' : ''} 
                            onchange="selectAnswer(${index})">
                        <label for="answer-${index}">${option}</label>
                    </div>
                `;
            });

            questionDiv.innerHTML = `
                <div class="question-number">Question ${currentQuestion + 1} of ${questions.length}</div>
                <div class="question-text">${question.question}</div>
                <div class="options">${optionsHTML}</div>
                <div class="feedback" id="feedback"></div>
            `;

            container.appendChild(questionDiv);

            if (userAnswers[currentQuestion] !== undefined) {
                document.getElementById(`answer-${userAnswers[currentQuestion]}`).checked = true;
                answered = true;
                showFeedback();
                document.getElementById('controls').style.display = 'flex';
                document.getElementById('nextBtn').disabled = false;
            } else {
                answered = false;
                document.getElementById('controls').style.display = 'none';
            }

            updateProgress();
        }

        function selectAnswer(index) {
            if (answered) return;

            userAnswers[currentQuestion] = index;
            const question = questions[currentQuestion];
            answered = true;

            showFeedback();

            document.querySelectorAll('.option input').forEach(input => {
                input.disabled = true;
            });

            document.getElementById('controls').style.display = 'flex';
            document.getElementById('nextBtn').disabled = false;
        }

        function showFeedback() {
            const question = questions[currentQuestion];
            const feedback = document.getElementById('feedback');
            const selectedAnswer = userAnswers[currentQuestion];
            const isCorrect = selectedAnswer === question.correctAnswer;

            document.querySelectorAll('.option').forEach((opt, idx) => {
                opt.classList.remove('correct-answer', 'wrong-answer', 'answered');
                opt.classList.add('answered');

                if (idx === question.correctAnswer) {
                    opt.classList.add('correct-answer');
                }
                if (idx === selectedAnswer && !isCorrect) {
                    opt.classList.add('wrong-answer');
                }
            });

            if (isCorrect) {
                feedback.className = 'feedback show correct';
                feedback.innerHTML = '<span class="feedback-icon">🌟</span><span>Great! That\'s correct!</span>';
            } else {
                feedback.className = 'feedback show incorrect';
                feedback.innerHTML = `<span class="feedback-icon">📚</span><span>Good try! The correct answer is: <strong>${question.options[question.correctAnswer]}</strong></span>`;
            }
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                answered = false;
                document.getElementById('controls').style.display = 'none';
                document.getElementById('nextBtn').disabled = true;
                renderQuestion();
            }
        }

        function submitQuiz() {
            if (userAnswers.length < questions.length) {
                alert('Please answer all questions before submitting!');
                return;
            }

            const correct = userAnswers.filter((ans, idx) => ans === questions[idx].correctAnswer).length;
            const incorrect = questions.length - correct;
            const percentage = (correct / questions.length) * 100;

            document.getElementById('questionsContainer').style.display = 'none';
            document.getElementById('controls').style.display = 'none';

            const resultContainer = document.getElementById('resultContainer');
            resultContainer.classList.add('show');

            const scoreCircle = document.getElementById('scoreCircle');
            scoreCircle.textContent = `${correct}/${questions.length}`;

            if (percentage >= 90) {
                scoreCircle.className = 'score-circle excellent';
                document.getElementById('performanceText').textContent = '⭐ Outstanding! You\'re an amazing student!';
            } else if (percentage >= 70) {
                scoreCircle.className = 'score-circle good';
                document.getElementById('performanceText').textContent = '👏 Excellent work! Keep it up!';
            } else if (percentage >= 50) {
                scoreCircle.className = 'score-circle fair';
                document.getElementById('performanceText').textContent = '📚 Good effort! Practice more!';
            } else {
                scoreCircle.className = 'score-circle poor';
                document.getElementById('performanceText').textContent = '💪 Keep trying! You can do it!';
            }

            document.getElementById('correctCount').textContent = `✓ ${correct} Correct`;
            document.getElementById('incorrectCount').textContent = `✗ ${incorrect} Incorrect`;

            const summaryBody = document.getElementById('summaryBody');
            summaryBody.innerHTML = '';

            questions.forEach((q, idx) => {
                const userAns = userAnswers[idx];
                const isCorrect = userAns === q.correctAnswer;
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong>Q${idx + 1}</strong></td>
                    <td>${q.options[userAns] || '—'}</td>
                    <td><strong>${q.options[q.correctAnswer]}</strong></td>
                    <td>${isCorrect ? '<span style="color: #86EFAC;">✓ Correct</span>' : '<span style="color: #FCA5A5;">✗ Wrong</span>'}</td>
                `;
                summaryBody.appendChild(row);
            });
        }

        function resetQuiz() {
            currentQuestion = 0;
            userAnswers = [];
            answered = false;
            document.getElementById('questionsContainer').style.display = 'block';
            document.getElementById('resultContainer').classList.remove('show');
            document.getElementById('controls').style.display = 'none';
            renderQuestion();
        }

        function updateProgress() {
            const progress = ((currentQuestion + 1) / questions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('progressText').textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
            document.getElementById('correctPercentage').textContent = Math.round(progress) + '%';
        }

        renderQuestion();
    </script>
</body>
</html>
